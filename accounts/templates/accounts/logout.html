{% extends "accounts/base.html" %}

{% block title %}
    Logout | Analyst Task Tracker
{% endblock %}

{% block content %}
    <h1>Log out</h1>

    <p class="message">
        Are you sure you want to end your session?
    </p>

    <div class="actions">
        <form method="post">
            {% csrf_token %}

            <button type="submit">
                Yes, log out
            </button>
        </form>

        <a class="button secondary" href="{% url 'accounts:success' %}">
            Cancel
        </a>
    </div>
{% endblock %}
